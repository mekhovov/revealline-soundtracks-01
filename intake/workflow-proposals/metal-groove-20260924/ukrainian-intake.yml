name: Prepare Ukrainian Shchedryk candidate

on:
  pull_request:
    paths:
      - "intake/ukrainian-shchedryk-20260924.json"
      - "intake/prepare.py"
      - "intake/test_prepare.py"
      - "intake/test_creator.py"
      - ".github/workflows/ukrainian-intake.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-ukrainian:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify unchanged published inventory
        run: node verify.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          repository: mekhovov/revealline
          ref: 71a0ffeaeb5079ac6e87a7d80327c6b34948aaa3
          path: .runtime
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /game/*.mjs
            /game/ui/*.mjs
            /game/content/*.mjs
      - name: Install audio validation tools
        if: github.event_name == 'workflow_dispatch'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test intake boundaries
        run: python3 -m unittest discover -s intake -p 'test_*.py'
      - name: Prepare one candidate without approving publication
        if: github.event_name == 'workflow_dispatch'
        run: python3 intake/prepare.py --manifest intake/ukrainian-shchedryk-20260924.json --output ukrainian-candidate-output --game-root .runtime
      - name: Report bounded receipt metadata without downloading audio
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          for name in ('receipt.json', 'review.json'):
              path = Path('ukrainian-candidate-output') / name
              if not path.is_file():
                  print(name + ': not created; inspect the preceding failure')
                  continue
              if path.stat().st_size > 2 * 1024 ** 2:
                  raise ValueError('Unexpectedly large intake metadata')
              body = path.read_bytes()
              print(name + ' sha256=' + hashlib.sha256(body).hexdigest())
              print(body.decode('utf8'))
          PY
      - name: Preserve original audio and all partial evidence
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ukrainian-shchedryk-candidate
          path: ukrainian-candidate-output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
