name: Prepare core soundtrack candidates

on:
  pull_request:
    paths:
      - 'intake/**'
      - '.github/workflows/core-intake.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify unchanged published inventory
        run: node verify.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
      - uses: actions/checkout@v4
        with:
          repository: mekhovov/revealline
          ref: 71a0ffeaeb5079ac6e87a7d80327c6b34948aaa3
          path: .runtime
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /game/*.mjs
            /game/ui/*.mjs
            /game/content/*.mjs
      - name: Install audio validation tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test intake boundaries
        run: python3 -m unittest discover -s intake -p 'test_*.py'
      - name: Acquire and measure candidates without approving publication
        run: python3 intake/prepare.py --manifest intake/core-20260924.json --output candidate-output --game-root .runtime
      - name: Preserve source audio and all partial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-soundtrack-candidates
          path: candidate-output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
