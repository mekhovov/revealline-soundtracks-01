name: Prepare Purgatory 3 metal audition candidates

on:
  pull_request:
    paths:
      - 'intake/purgatory3-audition-20260925.json'
      - 'intake/purgatory3-audition-20260925.md'
      - 'intake/purgatory3_pins.py'
      - 'intake/prepare_purgatory3.py'
      - 'intake/test_purgatory3.py'
      - 'intake/itch_source.py'
      - 'intake/itch_audio.py'
      - 'intake/prepare.py'
      - '.github/workflows/metal-purgatory3-intake.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
      - name: Verify source and historical archive boundaries
        run: |
          python3 -m unittest discover -s intake -p 'test_*.py'
          python3 intake/prepare_purgatory3.py --check
          node --test test-verify.mjs
          node verify.mjs

  prepare:
    needs: source
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
      - uses: actions/checkout@v4
        with:
          repository: mekhovov/revealline
          ref: 71a0ffeaeb5079ac6e87a7d80327c6b34948aaa3
          path: .runtime
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /game/*.mjs
            /game/ui/*.mjs
            /game/content/*.mjs
      - name: Test exact source identities and intake boundaries
        run: |
          set -o pipefail
          python3 -m unittest discover -s intake -p 'test_*.py' 2>&1 | tee purgatory3-tests.txt
          python3 intake/prepare_purgatory3.py --check
      - name: Install hosted audio validation tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Acquire, decode and measure candidates without approving publication
        run: python3 intake/prepare_purgatory3.py --output candidate-output --game-root .runtime
      - name: Preserve exact source audio and partial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purgatory3-metal-audition-candidates
          path: |
            candidate-output/
            purgatory3-tests.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
