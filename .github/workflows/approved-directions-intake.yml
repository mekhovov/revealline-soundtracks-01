name: Prepare approved-direction audition candidates

on:
  pull_request:
    paths:
      - 'intake/approved-directions-audition-20260925.json'
      - 'intake/approved_directions_pins.py'
      - 'intake/second_directions_pins.py'
      - 'intake/prepare_approved_directions.py'
      - 'intake/prepare.py'
      - 'intake/test_prepare.py'
      - 'intake/test_approved_directions.py'
      - 'intake/assemble_approved_directions.py'
      - 'intake/test_approved_assembly.py'
      - 'intake/build-unified-catalogue.mjs'
      - 'intake/itch_source.py'
      - 'intake/itch_audio.py'
      - '.github/workflows/approved-directions-intake.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare a new candidate artifact or assemble the fixed reviewed artifact
        type: choice
        options: [prepare, assemble]
        default: prepare
        required: true

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
      - name: Verify source and historical archive boundaries
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s intake -p 'test_*.py'
          python3 intake/prepare_approved_directions.py --check
          node --test test-verify.mjs
          node verify.mjs
  prepare:
    needs: source
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'prepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
      - name: Verify unchanged published inventory
        run: node verify.mjs
      - uses: actions/checkout@v4
        with:
          repository: mekhovov/revealline
          ref: 71a0ffeaeb5079ac6e87a7d80327c6b34948aaa3
          path: .runtime
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /game/*.mjs
            /game/ui/*.mjs
            /game/content/*.mjs
      - name: Test exact source identities and intake boundaries
        run: |
          set -o pipefail
          python3 -m unittest discover -s intake -p 'test_*.py' 2>&1 | tee approved-directions-tests.txt
          python3 intake/prepare_approved_directions.py --check
      - name: Install hosted audio validation tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Acquire and measure candidates without approving publication
        run: python3 intake/prepare_approved_directions.py --output candidate-output --game-root .runtime
      - name: Preserve exact source audio and partial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-directions-audition-candidates
          path: |
            candidate-output/
            approved-directions-tests.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
  assemble:
    needs: source
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'assemble' && github.ref == 'refs/heads/codex/approved-directions-publication'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
      - name: Verify original artifact and assemble audition-only publication
        run: python3 intake/assemble_approved_directions.py
      - name: Verify assembled payload and unchanged historical entries
        run: |
          python3 -m unittest discover -s intake -p 'test_*.py'
          node --test test-verify.mjs
          node verify.mjs
          git diff --check
      - name: Commit only the generated audition publication to this review branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'codex/approved-directions-publication'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git add batches/synth-approved-directions-audition-20260925 batches/metal-approved-directions-audition-20260925 intake/archive/approved-directions-audition-20260925 batches.json catalogue.json deployment-manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Assemble twelve exact licensed audition recordings from hosted artifact'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Preserve small assembly verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-directions-assembly-evidence
          path: |
            intake/archive/approved-directions-audition-20260925/artifact-binding.json
            intake/archive/approved-directions-audition-20260925/artifact-member-hashes.json
            intake/archive/approved-directions-audition-20260925/assembly-review.json
          if-no-files-found: warn
          retention-days: 30
