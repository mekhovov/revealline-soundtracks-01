name: Prepare approved-direction audition candidates

on:
  pull_request:
    paths:
      - 'intake/approved-directions-audition-20260925.json'
      - 'intake/approved_directions_pins.py'
      - 'intake/prepare_approved_directions.py'
      - 'intake/test_approved_directions.py'
      - 'intake/itch_source.py'
      - 'intake/itch_audio.py'
      - '.github/workflows/approved-directions-intake.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
      - name: Verify unchanged published inventory
        run: node verify.mjs
      - uses: actions/checkout@v4
        with:
          repository: mekhovov/revealline
          ref: 71a0ffeaeb5079ac6e87a7d80327c6b34948aaa3
          path: .runtime
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /game/*.mjs
            /game/ui/*.mjs
            /game/content/*.mjs
      - name: Test exact source identities and intake boundaries
        run: |
          set -o pipefail
          python3 -m unittest discover -s intake -p 'test_*.py' 2>&1 | tee approved-directions-tests.txt
          python3 intake/prepare_approved_directions.py --check
      - name: Install hosted audio validation tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Acquire and measure candidates without approving publication
        run: python3 intake/prepare_approved_directions.py --output candidate-output --game-root .runtime
      - name: Preserve exact source audio and partial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-directions-audition-candidates
          path: |
            candidate-output/
            approved-directions-tests.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
